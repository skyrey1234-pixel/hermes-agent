services:
  node-setup:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - node_runtime:/opt/node
    command: >-
      sh -ec 'cp -a /usr/local/bin /usr/local/lib /opt/node/;
      npm ci --workspace web --workspace ui-tui --workspace ui-tui/packages/hermes-ink --workspace apps/shared --include-workspace-root;
      npm run build --workspace ui-tui'
  python-setup:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
      - python_env:/opt/venv
    command: >-
      sh -ec 'python -m venv /opt/venv;
      /opt/venv/bin/pip install -e ".[web]"'
  api:
    image: python:3.12-slim
    working_dir: /app
    init: true
    env_file:
      - /run/base44/app.env
    environment:
      HERMES_HOME: /data/hermes
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
      PYTHONPATH: /app
      PATH: /opt/venv/bin:/opt/node/bin:/usr/local/bin:/usr/bin:/bin
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - .:/app
      - python_env:/opt/venv
      - node_modules:/app/node_modules
      - node_runtime:/opt/node:ro
      - hermes_data:/data/hermes
    depends_on:
      python-setup:
        condition: service_completed_successfully
      node-setup:
        condition: service_completed_successfully
    command: >-
      python -m watchfiles --filter python
      'python .base44/start_dashboard.py' hermes_cli plugins agent tools gateway tui_gateway .base44
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/api/status', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s
  web:
    image: node:22
    working_dir: /app
    init: true
    environment:
      HERMES_DASHBOARD_URL: http://api:9119
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    command: npm run dev --workspace web -- --host 0.0.0.0 --port 3000
volumes:
  node_modules:
  node_runtime:
  python_env:
  hermes_data:
