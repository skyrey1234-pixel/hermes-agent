# Base44 sandbox stack for Hermes Agent.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#
# Two app services, both running FROM THE CLONED SOURCE (bind mount, no
# prebuilt application image):
#   * web-build  — one-shot: installs the `web` workspace and builds the Vite
#                  SPA into hermes_cli/web_dist/ (the dist the Python server
#                  mounts). Re-runs on every `up`.
#   * dashboard  — the FastAPI/uvicorn dashboard, serving that dist on 9119,
#                  published as host port 3000 (the preview entry point).
#
# The dashboard binds 0.0.0.0 because the sandbox preview proxy reaches it over
# the container network. A non-loopback bind always engages the auth gate, so
# the password provider must be configured: the username comes from
# .env.base44-defaults, the password/secret from the platform-managed env file.
name: hermes-agent

services:
  web-build:
    image: node:24-bookworm
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - BASE44_PREVIEW_MODE
    # npm ci keeps the lockfile intact; `--workspace web` installs only the
    # dashboard frontend (root + web), not the TUI/desktop workspaces.
    command: ["sh", "-ec", "npm ci --workspace web --no-audit --no-fund && npm run build --workspace web"]

  dashboard:
    image: python:3.13-slim
    working_dir: /app
    restart: on-failure
    depends_on:
      web-build:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - hermes-home:/data
      - uv-cache:/root/.cache/uv
    env_file:
      - ./.env.base44-defaults   # sandbox placeholders — first, so real secrets win
      - /run/base44/app.env      # platform-managed secrets — LAST, always wins
    environment:
      - BASE44_PREVIEW_MODE
      - HERMES_HOME=/data
      - HERMES_WEB_DIST=/app/hermes_cli/web_dist
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - PYTHONUNBUFFERED=1
    ports:
      - "3000:9119"
    # Dependencies are synced from the checkout's uv.lock on every start, so a
    # manifest/lockfile edit takes effect without an image rebuild.
    command:
      - sh
      - -ec
      - >-
        pip install --no-cache-dir -q uv==0.11.6 &&
        uv sync --frozen --no-dev &&
        exec /opt/venv/bin/python -m hermes_cli.main dashboard
        --no-open --host 0.0.0.0 --port 9119 --skip-build
    labels:
      base44.project: "Hermes Agent Dashboard"
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      # /api/status is a public endpoint on the gated dashboard, so this proves
      # the server answers without needing a login.
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:9119/api/status", timeout=5).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  hermes-home:
  uv-cache:
